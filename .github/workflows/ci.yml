name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build (Xcode ${{ matrix.xcode }}, ${{ matrix.device }})
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: [16.2, latest]
        device: [iphone15, iphone16, generic-ios, generic-iphone]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Build for Simulator/Device
        run: |
          if [[ "${{ matrix.xcode }}" == "16.2" && "${{ matrix.device }}" == "iphone15" ]]; then
            xcodebuild build -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 15' | xcpretty
          elif [[ "${{ matrix.xcode }}" != "16.2" && "${{ matrix.device }}" == "iphone16" ]]; then
            xcodebuild build -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 16' | xcpretty
          elif [[ "${{ matrix.device }}" == "generic-ios" ]]; then
            xcodebuild build -scheme BoxBurnSuplements -destination 'generic/platform=iOS Simulator' | xcpretty
          elif [[ "${{ matrix.device }}" == "generic-iphone" ]]; then
            xcodebuild build -scheme BoxBurnSuplements -destination 'generic/platform=iOS,name=iPhone' | xcpretty
          fi

  test:
    name: Test (Xcode ${{ matrix.xcode }}, ${{ matrix.device }})
    needs: build
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: [16.2, latest]
        device: [iphone15, iphone16]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Run Unit Tests
        run: |
          if [[ "${{ matrix.xcode }}" == "16.2" && "${{ matrix.device }}" == "iphone15" ]]; then
            xcodebuild test -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 15' -enableCodeCoverage YES | xcpretty
          elif [[ "${{ matrix.xcode }}" != "16.2" && "${{ matrix.device }}" == "iphone16" ]]; then
            xcodebuild test -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 16' -enableCodeCoverage YES | xcpretty
          fi
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profdata
          path: ~/Library/Developer/Xcode/DerivedData/**/Coverage.profdata

  coverage:
    name: Coverage Report
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-profdata
          path: coverage
      - name: Install xcov
        run: gem install xcov
      - name: Generate Coverage Report
        run: |
          xcov -p BoxBurnSuplements -s BoxBurnSuplements.xcodeproj -o coverage/summary --derived_data_path ~/Library/Developer/Xcode/DerivedData
          cat coverage/summary/xcov_report.json
      - name: Print Friendly Coverage Summary
        run: |
          if [ -f coverage/summary/xcov_report.json ]; then
            jq '.coverage' coverage/summary/xcov_report.json
          fi
      - name: Print Full Coverage Report
        run: |
          if [ -f coverage/summary/xcov_report.json ]; then
            cat coverage/summary/xcov_report.json
          fi 