name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    name: Build (${{ matrix.xcode }}, ${{ matrix.device }})
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: [16.2, latest]
        device: [iphone15, iphone16, generic-ios, generic-iphone]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      # Set up the requested Xcode version
      - name: Set up Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      # Detect the actual Xcode version and export as env var
      - name: Detect Xcode Version
        run: |
          XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "Detected Xcode version: $XCODE_VERSION"
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
      # Build for the appropriate device based on Xcode version
      - name: Build for Simulator/Device (smart logic)
        run: |
          echo "Building for device: ${{ matrix.device }} with Xcode $XCODE_VERSION"
          if [[ "$XCODE_VERSION" == "16.2" && "${{ matrix.device }}" == "iphone15" ]]; then
            echo "[CI] Building for iPhone 15 Simulator (Xcode 16.2)"
            xcodebuild build -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 15' | xcpretty
          elif [[ "$XCODE_VERSION" != "16.2" && "${{ matrix.device }}" == "iphone16" ]]; then
            echo "[CI] Building for iPhone 16 Simulator (Xcode $XCODE_VERSION)"
            xcodebuild build -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 16' | xcpretty
          elif [[ "${{ matrix.device }}" == "generic-ios" ]]; then
            echo "[CI] Building for generic iOS Simulator"
            xcodebuild build -scheme BoxBurnSuplements -destination 'generic/platform=iOS Simulator' | xcpretty
          elif [[ "${{ matrix.device }}" == "generic-iphone" ]]; then
            echo "[CI] Building for generic iPhone device"
            xcodebuild build -scheme BoxBurnSuplements -destination 'generic/platform=iOS,name=iPhone' | xcpretty
          else
            echo "[CI] Skipping build for this matrix combination."
          fi

  test-matrix:
    name: Test (${{ matrix.xcode }}, ${{ matrix.device }})
    needs: build-matrix
    runs-on: macos-latest
    strategy:
      matrix:
        xcode: [16.2, latest]
        device: [iphone15, iphone16]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode ${{ matrix.xcode }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ matrix.xcode }}
      - name: Detect Xcode Version
        run: |
          XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "Detected Xcode version: $XCODE_VERSION"
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
      - name: Run Unit Tests (smart logic)
        run: |
          echo "Testing on device: ${{ matrix.device }} with Xcode $XCODE_VERSION"
          if [[ "$XCODE_VERSION" == "16.2" && "${{ matrix.device }}" == "iphone15" ]]; then
            echo "[CI] Running tests on iPhone 15 Simulator (Xcode 16.2)"
            xcodebuild test -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 15' -enableCodeCoverage YES | xcpretty
          elif [[ "$XCODE_VERSION" != "16.2" && "${{ matrix.device }}" == "iphone16" ]]; then
            echo "[CI] Running tests on iPhone 16 Simulator (Xcode $XCODE_VERSION)"
            xcodebuild test -scheme BoxBurnSuplements -destination 'platform=iOS Simulator,name=iPhone 16' -enableCodeCoverage YES | xcpretty
          else
            echo "[CI] Skipping test for this matrix combination."
          fi
      - name: Upload Coverage Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-profdata
          path: ~/Library/Developer/Xcode/DerivedData/**/Coverage.profdata

  coverage:
    name: Coverage Report
    needs: test-matrix
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Xcode latest
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - name: Detect Xcode Version
        run: |
          XCODE_VERSION=$(xcodebuild -version | head -n 1 | awk '{print $2}')
          echo "Detected Xcode version: $XCODE_VERSION"
          echo "XCODE_VERSION=$XCODE_VERSION" >> $GITHUB_ENV
      - name: Download Coverage Artifacts
        uses: actions/download-artifact@v4
        with:
          name: coverage-profdata
          path: coverage
      - name: Install xcov
        run: gem install xcov
      - name: Generate Coverage Report
        run: |
          echo "[CI] Generating coverage report with xcov (Xcode $XCODE_VERSION)"
          xcov -p BoxBurnSuplements -s BoxBurnSuplements.xcodeproj -o coverage/summary --derived_data_path ~/Library/Developer/Xcode/DerivedData
          cat coverage/summary/xcov_report.json
      - name: Print Friendly Coverage Summary
        run: |
          if [ -f coverage/summary/xcov_report.json ]; then
            echo "[CI] Friendly Coverage Summary:"
            jq '.coverage' coverage/summary/xcov_report.json
          fi
      - name: Print Full Coverage Report
        run: |
          if [ -f coverage/summary/xcov_report.json ]; then
            echo "[CI] Full Coverage Report:"
            cat coverage/summary/xcov_report.json
          fi 